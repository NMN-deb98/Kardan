name: Android APK and Release
on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
      - name: Run unit tests
        run: |
          set -o pipefail
          gradle --no-daemon testDebugUnitTest 2>&1 | tee test.log
      - name: Build installable debug APK
        run: |
          set -o pipefail
          gradle --no-daemon assembleDebug 2>&1 | tee build.log
      - name: Publish build log tail on failure
        if: failure()
        run: |
          mkdir -p /tmp/ci && cd /tmp/ci
          { echo "== run ${{ github.run_id }} sha ${{ github.sha }}"; for f in "$GITHUB_WORKSPACE/build.log" "$GITHUB_WORKSPACE/test.log"; do [ -f "$f" ] && { echo "--- $(basename $f) errors"; grep -E "^e: |error:|FAILED|Exception|What went wrong" -A3 "$f" | head -150; echo "--- tail"; tail -40 "$f"; }; done; } > log.txt || true
          git init -q . && git config user.name ci && git config user.email ci@example.com
          git checkout -q -b ci-logs && cp log.txt log.txt.bak && git add log.txt && git commit -q -m "ci log ${{ github.run_id }}"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" ci-logs
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Kardan-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
      - name: Publish GitHub Release
        if: github.event_name == 'push' && contains(github.event.head_commit.message, '[release]')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.2.0
          target_commitish: ${{ github.sha }}
          name: کاردان 1.2.0
          body: |
            ## کاردان 1.2.0

            **مرکز آموزش تصویری:** نمایش یکی‌یکی مرحله‌ها با «مرحلهٔ قبل/بعد» و نوار پیشرفت، دکمهٔ «این روش جواب نداد» با راه‌حل جایگزین و راهنماهای مرتبط، نمایش نسخهٔ اندرویدِ مناسب و تاریخ بازبینی هر راهنما، هشدار «ممکن است قدیمی باشد» برای راهنماهای وابسته به ظاهر برنامه، دسته‌بندی تصویری، فیلتر زیرگروه (هر پیام‌رسان یا اپراتور) و جست‌وجوی تحمل‌کنندهٔ غلط تایپی.

            **پیام‌رسان‌ها:** برای بله، ایتا، روبیکا، سروش پلاس، تلگرام و واتس‌اپ هر کدام راهنمای نصب و به‌روزرسانی، ارسال پیام و فایل، گروه و کانال، اعلان‌ها، حریم خصوصی، مسدودکردن و گزارش، بازیابی حساب و مشکلات رایج، و تشخیص پیام مشکوک.

            **خرید اینترنتی:** راهنمای ثبت سفارش و پرداخت، بررسی فروشنده، لغو و مرجوعی، و خرید داخلی و خارجی. کاردان اطلاعات کارت و رمز پویا نمی‌گیرد.

            **بستهٔ اینترنت:** راهنمای رسمی همراه اول، ایرانسل و رایتل برای بسته‌ها، تمدید خودکار و غیرفعال‌کردن آن، و راهنمای «پول کسر شد ولی بسته فعال نشد» که به خرید دوباره تشویق نمی‌کند. قیمت و کد از خودِ برنامه نوشته نمی‌شود و به منبع رسمی هدایت می‌شود.

            **فیلم و سریال:** بخش مستقل با نام فارسی و اصلی، سال، ژانر، خلاصه، مدت، امتیاز، فیلتر و جست‌وجوی تحمل‌کنندهٔ غلط تایپی، و لینک تماشای قانونی که خودتان وارد می‌کنید.

            **دستیار:** درخواست مبهم را با یک سؤال کوتاه روشن می‌کند، کنار پیشنهادهای نیازمند تأیید دکمهٔ انصراف دارد و صادقانه اعلام می‌کند که به پیام‌های خصوصی و برنامه‌های دیگر دسترسی ندارد.

            **صفحهٔ اصلی و ظاهر:** نشان کاردان، دسته‌بندی قابلیت‌ها و کارت راهنمای تصویری؛ اصلاح جهت متن برای شماره و لینک و جلوگیری از بریده‌شدن متن‌های طولانی.

            **محدودیت‌ها:** نسخهٔ آزمایشی است و روی دستگاه‌های مختلف کامل آزمایش نشده. کاتالوگ آنلاین فیلم با پوستر و امتیاز، قیمت زندهٔ بسته‌ها و مقایسهٔ قیمت فروشگاه‌ها هنوز وصل نیست، چون به منبع رسمی و مجوز نیاز دارد. دستیار آفلاین است و به همهٔ برنامه‌های گوشی دسترسی ندارد. هیچ خرید، ارسال یا حذفی بدون تأیید کاربر انجام نمی‌شود.
          files: app/build/outputs/apk/debug/app-debug.apk
          fail_on_unmatched_files: true
          draft: false
          prerelease: false
