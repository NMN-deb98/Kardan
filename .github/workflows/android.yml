name: Android APK and Release
on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
      - name: Run unit tests
        run: |
          set -o pipefail
          gradle --no-daemon testDebugUnitTest 2>&1 | tee test.log
      - name: Build installable debug APK
        run: |
          set -o pipefail
          gradle --no-daemon assembleDebug 2>&1 | tee build.log
      - name: Publish build log tail on failure
        if: failure()
        run: |
          mkdir -p /tmp/ci && cd /tmp/ci
          { echo "== run ${{ github.run_id }} sha ${{ github.sha }}"; for f in "$GITHUB_WORKSPACE/build.log" "$GITHUB_WORKSPACE/test.log"; do [ -f "$f" ] && { echo "--- $(basename $f) errors"; grep -E "^e: |error:|FAILED|Exception|What went wrong" -A3 "$f" | head -150; echo "--- tail"; tail -40 "$f"; }; done; } > log.txt || true
          git init -q . && git config user.name ci && git config user.email ci@example.com
          git checkout -q -b ci-logs && cp log.txt log.txt.bak && git add log.txt && git commit -q -m "ci log ${{ github.run_id }}"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" ci-logs
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Kardan-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
      - name: Publish GitHub Release
        if: github.event_name == 'push' && contains(github.event.head_commit.message, '[release]')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.3.0
          target_commitish: ${{ github.sha }}
          name: کاردان 1.3.0
          body: |
            ## کاردان 1.3.0

            **مخاطبان:** با اجازهٔ شما مخاطبان گوشی داخل کاردان دیده و جست‌وجو می‌شوند (نام و شماره، با تحمل غلط تایپی). پیش از درخواست مجوز، دلیلش به‌روشنی توضیح داده می‌شود. فقط مخاطبانی که ستاره بزنید در کاردان ذخیره می‌شوند و هیچ‌چیز به سرور فرستاده نمی‌شود. دکمهٔ تماس و پیامک فقط شماره‌گیر یا برنامهٔ پیام را با همان شماره باز می‌کند و خودتان تأیید می‌کنید. سابقهٔ تماس خوانده نمی‌شود؛ فقط خود برنامهٔ تماس گوشی باز می‌شود.

            **فیلم و سریال:** جست‌وجوی گوگل داخل برنامه (همه نتیجه‌ها، IMDb یا ویکی‌پدیا) یا در مرورگر؛ نتیجه را با یک لمس به فهرست تماشا اضافه کنید. دستیار هم برای «یک فیلم معمایی معرفی کن» پس از تأیید شما در گوگل جست‌وجو می‌کند. نیاز به اینترنت دارد و عبارت جست‌وجو برای گوگل فرستاده می‌شود؛ پوستر، امتیاز و لینک را گوگل نشان می‌دهد و کاردان خودش چیزی نمی‌سازد.

            **مقایسهٔ بستهٔ اینترنت:** فهرست واقعی بسته‌های رایتل از صفحهٔ رسمی (۱، ۳ و ۷ روزه و نامحدودهای زمان‌دار) با مرتب‌سازی ارزان‌ترین هر گیگ، زمان آخرین بررسی و منبع. برای همراه اول و ایرانسل، سایت رسمی اجازهٔ خواندن خودکار فهرست را نمی‌دهد؛ لینک رسمی و امکان ذخیرهٔ بستهٔ خودتان برای مقایسه هست و قیمت حدسی نوشته نمی‌شود.

            **دستیار:** «به علی زنگ بزن» یا «برای علی پیامک بزن» مخاطب را پیدا می‌کند و فقط پس از تأیید شما شماره‌گیر یا برنامهٔ پیام را باز می‌کند؛ اگر چند مخاطب بود می‌پرسد کدام.

            **اصلاح‌ها:** ورود قیمت با جداکنندهٔ هزارگان عربی در مقایسهٔ بسته، و دکمهٔ برگشت گوشی در مدیریت فایل.

            **محدودیت‌ها:** نسخهٔ آزمایشی است و روی دستگاه‌های مختلف کامل آزمایش نشده. فهرست بسته‌های رایتل عکس لحظهٔ بررسی است و ممکن است تغییر کرده باشد؛ پیش از خرید از منبع رسمی بسنجید. فهرست رسمی همراه اول و ایرانسل در برنامه نیست. هیچ خرید، تماس، پیامک یا حذفی بدون تأیید کاربر انجام نمی‌شود.
          files: app/build/outputs/apk/debug/app-debug.apk
          fail_on_unmatched_files: true
          draft: false
          prerelease: false
