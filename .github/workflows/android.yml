name: Android APK and Release
on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
      - name: Run unit tests
        run: gradle --no-daemon testDebugUnitTest
      - name: Build installable debug APK
        run: gradle --no-daemon assembleDebug
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Kardan-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
      - name: Publish GitHub Release
        if: github.event_name == 'push' && contains(github.event.head_commit.message, '[release]')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.2
          target_commitish: ${{ github.sha }}
          name: کاردان 1.0.2
          body: |
            ## کاردان 1.0.2

            نخستین انتشار رسمی عمومی نسخهٔ MVP کاردان.

            - رابط فارسی و راست‌چین
            - راهنماهای کاربردی و جست‌وجو
            - ماشین‌حساب آفلاین
            - فهرست کارها با افزودن، تکمیل و حذف
            - نگه‌داری فهرست کارها روی دستگاه

            **محدودیت‌ها:** این نسخه روی دستگاه فیزیکی و طیف گسترده‌ای از دستگاه‌های اندرویدی آزمایش نشده است. این نسخه شامل تقویم شمسی، اعلان‌ها، همگام‌سازی ابری یا خزانهٔ رمزها نیست.
            آزمون‌های واحد و ساخت APK در GitHub Actions اجرا می‌شوند. قبل از نصب، از داده‌های مهم نسخهٔ پشتیبان داشته باشید.
          files: app/build/outputs/apk/debug/app-debug.apk
          fail_on_unmatched_files: true
          draft: false
          prerelease: false
