name: Android APK and Release
on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
      - name: Run unit tests
        run: gradle --no-daemon testDebugUnitTest
      - name: Build installable debug APK
        run: gradle --no-daemon assembleDebug
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Kardan-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
      - name: Publish GitHub Release
        if: github.event_name == 'push' && contains(github.event.head_commit.message, '[release]')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.1
          target_commitish: ${{ github.sha }}
          name: کاردان 1.0.1
          body: |
            ## کاردان 1.0.1
            - ذخیره دائمی کارها روی دستگاه
            - خزانه رمزها با رمزنگاری AES-GCM محلی
            - راهنمای آفلاین کاربردی
            - بخش راهنمای سالمندان و خرید بسته اینترنت از پیوندهای رسمی اپراتورها
            - پیوند به ویدئوهای آموزشی مرتبط
            - رابط فارسی و راست‌چین
            این APK برای نصب مستقیم ساخته شده است. این نسخه هنوز تست فیزیکی روی دستگاه‌های مختلف نشده و دستیار آن آفلاین و محدود است.
          files: app/build/outputs/apk/debug/app-debug.apk
          fail_on_unmatched_files: true
          draft: false
          prerelease: false
